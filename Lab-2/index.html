<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Oils &amp; Butters — Responsive Rehearsal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav
        class="navbar navbar-expand-md navbar-light bg-light py-2"
        aria-label="Main Navigation"
      >
        <div class="container-fluid px-3">
          <a class="navbar-brand fw-bold text-uppercase" href="#"
            >Oils &amp; Butters</a
          >

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent"
            aria-controls="navbarContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav mx-auto mb-2 mb-md-0 text-center">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#shop">Shop All</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#about">About Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#sustainability">Sustainability</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#contact">Contact</a>
              </li>
            </ul>

            <div class="d-flex justify-content-center justify-content-md-end">
              <button
                class="btn btn-outline-dark"
                type="button"
                aria-label="Shopping Cart"
              >
                Cart
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-4" id="shop">
      <section aria-labelledby="featured-products-title">
        <h2 id="featured-products-title" class="mb-4">Featured Products</h2>

        <div class="row g-3">
          <div class="col-12 col-md-6 col-lg-3">
            <article class="border p-3 h-100 d-flex flex-column">
              <div class="bg-light text-center py-4 mb-2">image</div>
              <h3>Rose Hip Face Butter</h3>
              <p>Rs.1,500.00</p>
              <button type="button" class="btn btn-dark w-100 mt-auto">
                Add to Cart
              </button>
            </article>
          </div>

          <div class="col-12 col-md-6 col-lg-3">
            <article class="border p-3 h-100 d-flex flex-column">
              <div class="bg-light text-center py-4 mb-2">image</div>
              <h3>Magnesium Spray</h3>
              <p>Rs.1,600.00</p>
              <button type="button" class="btn btn-dark w-100 mt-auto">
                Add to Cart
              </button>
            </article>
          </div>

          <div class="col-12 col-md-6 col-lg-3">
            <article class="border p-3 h-100 d-flex flex-column">
              <div class="bg-light text-center py-4 mb-2">image</div>
              <h3>Cinnamon Body Butter</h3>
              <p>From Rs.1,599.00</p>
              <button type="button" class="btn btn-dark w-100 mt-auto">
                Add to Cart
              </button>
            </article>
          </div>

          <div class="col-12 col-md-6 col-lg-3">
            <article class="border p-3 h-100 d-flex flex-column">
              <div class="bg-light text-center py-4 mb-2">image</div>
              <h3>Eucalyptus &amp; Lemon Candle</h3>
              <p>Rs.1,900.00</p>
              <button type="button" class="btn btn-dark w-100 mt-auto">
                Add to Cart
              </button>
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
